[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-telemetry-etl"
version = "0.1.0"
description = "Portfolio-grade ETL pipeline for Tesla-style connected vehicle telemetry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "snowflake-connector-python[pandas]>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
airflow = [
  "apache-airflow>=2.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "dags"]
